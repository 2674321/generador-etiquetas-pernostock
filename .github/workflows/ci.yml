name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (GTK3 / Cairo / poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-3-dev libgirepository1.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 \
            gir1.2-pango-1.0 poppler-utils

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Suite de pruebas (núcleo sin GUI)
        run: rake test